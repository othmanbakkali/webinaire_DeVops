version: '3.8'

services:
  web:
    build: .
    container_name: django_webinar_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8333:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=webinaire_devops
      - DB_USER=postgres
      - DB_PASSWORD=root
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: postgres_webinar_db
    environment:
      POSTGRES_DB: webinaire_devops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432" # Rend PostgreSQL disponible sur l'hôte au port 5433
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
